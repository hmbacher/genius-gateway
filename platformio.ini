; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
description = Genius Gateway - A gateway for Hekatron Genius Plus X smoke detectors
data_dir = data
extra_configs =
	factory_settings.ini
	features.ini
;default_envs = esp32-s3-devkitc-1
;default_envs = esp32-s3-devkitc-1-n8r2
;default_envs = seeed-xiao-esp32s3
default_envs = gg-v1_0

[env]
framework = arduino
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip

build_flags = 
	${factory_settings.build_flags}
	${features.build_flags}
    -D BUILD_TARGET=\"$PIOENV\"
    -D APP_NAME=\"Genius-Gateway\" ; Must only contain characters from [a-zA-Z0-9-_] as this is converted into a filename
    -D APP_VERSION=\"1.4.1\" ; semver compatible version string
    -D GITHUB_REPO_OWNER=\"hmbacher\" ; GitHub repository owner for firmware updates
    -D GITHUB_REPO_NAME=\"genius-gateway\" ; GitHub repository name for firmware updates
    ; Move all networking stuff to the protocol core 0 and leave business logic on application core 1
    -D ESP32SVELTEKIT_RUNNING_CORE=0

    ; Uncomment EMBED_WWW to embed the WWW data in the firmware binary
    -D EMBED_WWW

    ; Uncomment to configure Cross-Origin Resource Sharing
    ; -D ENABLE_CORS
    ; -D CORS_ORIGIN=\"*\"

    ; Uncomment to enable informations from ESP32-Sveltekit in Serial Monitor
    ;-D SERIAL_INFO

    ; Uncomment to skip SSL certificate verification when downloading firmware updates
    ;-D DOWNLOAD_OTA_SKIP_CERT_VERIFY
    
    ; D E B U G   B U I L D F L A G S
    ; ===============================
    ; These build flags are only for debugging purposes and should not be used in production
    -D CONFIG_ARDUHAL_LOG_COLORS

	; Uncomment to show log messages from the ESP Arduino Core and ESP32-SvelteKit
	-D CORE_DEBUG_LEVEL=3

    ; Serve config files from flash and access at /config/filename.json
    ;-D SERVE_CONFIG_FILES

    ; Uncomment to teleplot all task high watermarks to Serial
    ;-D TELEPLOT_TASKS

    ; Uncomment to use JSON instead of MessagePack for event messages. Default is MessagePack.
    ;-D EVENT_USE_JSON=1 
    
lib_compat_mode = strict

; Source for SSL Cert Store can bei either downloaded from Mozilla with 'mozilla' ('https://curl.se/ca/cacert.pem')
; or from a curated Adafruit repository with 'adafruit' (https://raw.githubusercontent.com/adafruit/certificates/main/data/roots.pem)
; or complied from a 'folder' full of *.pem / *.dem files stored in the ./ssl_certs folder
board_ssl_cert_source = mozilla
; board_ssl_cert_source = adafruit

; Uncomment to include the a Root CA SSL Certificate Bundle for all SSL needs
; Needs -D FT_DOWNLOAD_FIRMWARE=1 and -D FT_NTP=1
board_build.embed_files = src/certs/x509_crt_bundle.bin

monitor_speed = 115200
monitor_filters =
    log2file
board_build.filesystem = littlefs
extra_scripts =
    pre:scripts/fix_git_bare_repo_env.py ; drop injected git safe.bareRepository=explicit so the IDF component manager can read its bare git cache (see script)
    pre:scripts/ensure_app_version.py
    pre:scripts/generate_enums.py
    pre:scripts/build_interface.py
    pre:scripts/generate_cert_bundle.py
    scripts/merge_bin.py
    scripts/rename_fw.py
    scripts/save_elf.py
lib_deps = 
	ArduinoJson@>=7.0.0
    elims/PsychicMqttClient@^0.2.3


[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1 ; 8 MB flash, No PSRAM
build_flags =
    ${env.build_flags}
    ; No-PSRAM board: cap device count well below the 50-device PSRAM target.
    ; PsramAllocator falls back to internal heap when psramFound() is false, so
    ; everything compiles and runs - but the HA framework allocations (420 entities
    ; at 14/device) and ~150 B per GeniusDevice all compete for internal RAM.
    ; 10 devices is a conservative safe ceiling that leaves headroom for TLS / MQTT
    ; / WebSocket buffers without heap fragmentation.
    -D GATEWAY_MAX_DEVICES=10

[env:esp32-s3-devkitc-1-n8r2]
board = esp32-s3-devkitc1-n8r2 ; 8 MB flash, 2 MB PSRAM (platform board ID has no hyphen before the 1)
build_flags =
    ${env.build_flags}
custom_sdkconfig =
    CONFIG_SPIRAM_USE_MALLOC=y
    ; Drop the threshold low: HA entity String fields (object IDs ~24 B, type
    ; strings ~13 B, names ~5-20 B) are all <128 B and would stay in internal RAM
    ; at ALWAYSINTERNAL=128, fragmenting it until TLS handshakes fail (-32512).
    ; At 32, anything >32 B prefers PSRAM; only tiny hot allocations (<=32 B)
    ; stay internal. Trade-off: task stacks also land in PSRAM - CC1101 RX task
    ; is explicitly pinned to internal via xTaskCreatePinnedToCoreWithCaps.
    CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL=32
    ; Free another ~24 KB of internal RAM that was reserved for in-ISR allocations
    ; we don't actually do. ISR code uses task notifications, not malloc.
    CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL=8192
    ; Route WiFi RX/TX + LWIP buffers to PSRAM first (~50 KB internal freed).
    CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=y
    ; Force mbedTLS to allocate session buffers from PSRAM. Without this the
    ; TLS handshake (~30-50 KB working set) competes for internal RAM and fails
    ; with MBEDTLS_ERR_SSL_ALLOC_FAILED (-32512) once the heap is fragmented.
    ; The four MBEDTLS_*_MEM_ALLOC symbols are a Kconfig choice - must clear
    ; the others.
    CONFIG_MBEDTLS_DEFAULT_MEM_ALLOC=n
    CONFIG_MBEDTLS_INTERNAL_MEM_ALLOC=n
    CONFIG_MBEDTLS_CUSTOM_MEM_ALLOC=n
    CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=y

[env:seeed-xiao-esp32s3]
board = seeed_xiao_esp32s3 ; 8 MB flash, 8 MB PSRAM
build_flags =
    ${env.build_flags}
custom_sdkconfig =
    CONFIG_SPIRAM_USE_MALLOC=y
    ; Drop the threshold low: HA entity String fields (object IDs ~24 B, type
    ; strings ~13 B, names ~5-20 B) are all <128 B and would stay in internal RAM
    ; at ALWAYSINTERNAL=128, fragmenting it until TLS handshakes fail (-32512).
    ; At 32, anything >32 B prefers PSRAM; only tiny hot allocations (<=32 B)
    ; stay internal. Trade-off: task stacks also land in PSRAM - CC1101 RX task
    ; is explicitly pinned to internal via xTaskCreatePinnedToCoreWithCaps.
    CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL=32
    ; Free another ~24 KB of internal RAM that was reserved for in-ISR allocations
    ; we don't actually do. ISR code uses task notifications, not malloc.
    CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL=8192
    ; Route WiFi RX/TX + LWIP buffers to PSRAM first (~50 KB internal freed).
    CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=y
    ; Force mbedTLS to allocate session buffers from PSRAM. Without this the
    ; TLS handshake (~30-50 KB working set) competes for internal RAM and fails
    ; with MBEDTLS_ERR_SSL_ALLOC_FAILED (-32512) once the heap is fragmented.
    ; The four MBEDTLS_*_MEM_ALLOC symbols are a Kconfig choice - must clear
    ; the others.
    CONFIG_MBEDTLS_DEFAULT_MEM_ALLOC=n
    CONFIG_MBEDTLS_INTERNAL_MEM_ALLOC=n
    CONFIG_MBEDTLS_CUSTOM_MEM_ALLOC=n
    CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=y

; Genius Gateway PCB 1.0 (the product): the Seeed XIAO board + the soldered "GG v1.0" CC1101 pins.
; Inherits board, PSRAM sdkconfig and unflags from seeed-xiao-esp32s3.
[env:gg-v1_0]
extends = env:seeed-xiao-esp32s3
build_flags =
    ${env:seeed-xiao-esp32s3.build_flags}
    -D HW_VERSION=\"GG-1.0\"
    -D BOARD_GG_V1