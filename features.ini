[features]
build_flags = 
  -D FT_SECURITY=1
  -D FT_MQTT=1
  -D FT_NTP=1
  -D FT_UPLOAD_FIRMWARE=1
  -D FT_DOWNLOAD_FIRMWARE=1 ; requires FT_NTP=1
  -D FT_SLEEP=0
  -D FT_BATTERY=0
  -D FT_ANALYTICS=1
  -D FT_COREDUMP=1
  -D FT_HOME_ASSISTANT=1 ; requires FT_MQTT=1 and FT_DOWNLOAD_FIRMWARE=1
  ; Genius Gateway specific features from here:
  -D FT_ALLOW_BROADCAST=0
