; Common build flags shared across all boards
[common]
build_flags = 
  -D HOST_ID=1

; Board-specific build flags for Espressif ESP32S3 DevKit-C 1
[esp32-s3-devkitc-1]
build_flags = 
  ${common.build_flags}
  -D HW_VERSION=\"DEV-esp32-s3-devkitc-1\"
  -D CONFIG_CSN_GPIO=45
  -D CONFIG_MISO_GPIO=11
  -D CONFIG_GDO0_GPIO=47
  -D CONFIG_MOSI_GPIO=13
  -D CONFIG_SCK_GPIO=12
  -D GPIO_TEST1=21
  -D GPIO_TEST2=14

; Board-specific build flags for Espressif ESP32S3 DevKit-C 1 with PSRAM (N8R2)
; Inherits pin config from esp32-s3-devkitc-1
[esp32-s3-devkitc-1-n8r2]
build_flags = 
  ${esp32-s3-devkitc-1.build_flags}

; Board-specific build flags for Seeed XIAO ESP32S3 & Genius Gateway PCB 1.0
[seeed-xiao-esp32s3]
build_flags = 
  ${common.build_flags}
  -D HW_VERSION=\"GG-1.0\"
  -D CONFIG_CSN_GPIO=5
  -D CONFIG_MISO_GPIO=8
  -D CONFIG_GDO0_GPIO=6
  -D CONFIG_MOSI_GPIO=9
  -D CONFIG_SCK_GPIO=7
  -D GPIO_TEST1=1
  -D GPIO_TEST2=2
  -D GPIO_TEST3=3
  -D GPIO_TEST4=4
